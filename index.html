<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sổ tay chuyên môn</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="logo-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0C1654">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kèm cẩm nang 8 ngành chủ chốt tại Lâm Đồng. Ngân hàng 3.000 câu hỏi song ngữ Việt – Anh: thuế, lao động – BHXH, kế toán – kiểm soát – kiểm toán (VSA, IFRS), tài chính, kế toán quản trị, Thực chiến nâng cao (COSO, kiểm toán BCTC, gian lận, case) và Kinh tế học (vĩ mô, vi mô, phân tích quyết định, nâng cao, thực chiến).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: bàn làm bài kiểu phòng thi máy tính (CBT) — thanh ứng dụng; thiết lập đề theo 4 bước + phiếu tóm tắt dính bên phải; khi làm bài: đề thi bên trái, bảng điều hướng câu bên phải; kết quả là bảng điểm có phân tích. */
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --surface-2: #F7F9FC; --sunk: #E9EEF5;
  --ink: #0C1654; --ink-2: #2E3A5C; --muted: #6A7491;
  --line: #E3E8F0; --line-strong: #CCD4E2;
  --accent: #0C1654; --accent-2: #1D3A8F; --accent-soft: #EAF6F9; --accent-ink: #FFFFFF;
  --brand-cyan: #76CFE0;
  --appbar: #FFFFFF; --appbar-ink: #0C1654; --appbar-muted: #6A7491; --appbar-line: #E3E8F0;
  --ok: #17734A; --ok-soft: #E4F4EB; --bad: #B4232A; --bad-soft: #FBE9E9; --flag: #9A5A08; --flag-soft: #FCF0DC;
  --focus: #1D3A8F; --scrim: rgba(12, 22, 84, .35);
  --shadow: 0 1px 2px rgba(12, 22, 84, .05), 0 10px 28px -18px rgba(12, 22, 84, .25);
  --f-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-serif: "Source Serif 4", "Noto Serif", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--appbar); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-weight: 700; text-wrap: balance; margin: 0; color: var(--ink); letter-spacing: -.01em; }
h1 { font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.95rem); line-height: 1.18; letter-spacing: -.02em; }
h2 { font-size: 1.08rem; line-height: 1.3; }
h3 { font-size: .95rem; line-height: 1.3; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.note { font-size: .82rem; color: var(--muted); }

/* App bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--appbar); color: var(--appbar-ink); border-bottom: 1px solid var(--appbar-line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 9px; }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--appbar-ink); color: var(--appbar); font-family: var(--f-mono); font-weight: 600; font-size: .82rem; letter-spacing: -.02em; }
.brand-name { display: block; font-weight: 800; font-size: 1.02rem; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; }
.brand-sub { display: block; font-size: .72rem; color: var(--appbar-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-tools { display: flex; align-items: center; gap: 10px; flex: none; }
.src-btn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--appbar-line); background: transparent; color: var(--appbar-ink); border-radius: 8px; padding: 5px 10px; line-height: 1.15; text-align: left; }
.src-btn:hover { border-color: var(--appbar-muted); }
.src-btn.light { border-color: var(--line-strong); background: var(--surface); color: var(--ink); justify-self: start; margin-top: 6px; }
.src-btn.light:hover { border-color: var(--accent-2); }
.src-btn.light .s1 { color: var(--muted); }
.src-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(91, 203, 146, .18); flex: none; }
.src-btn .s1 { display: block; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--appbar-muted); font-weight: 700; }
.src-btn .s2 { display: block; font-family: var(--f-mono); font-size: .8rem; font-weight: 600; }
.top .seg { border-color: var(--appbar-line); background: transparent; }
.top .seg button { color: var(--appbar-muted); }
.top .seg button + button { border-left-color: var(--appbar-line); }
.top .seg button[aria-pressed="true"] { background: var(--appbar-ink); color: var(--appbar); }

/* Common */
main { padding-block: 22px 40px; min-height: 60vh; }
.stack { display: grid; gap: 16px; align-content: start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; padding: 9px 15px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: .9rem; color: var(--ink); min-height: 40px; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn:hover { border-color: var(--accent-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-strong { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn-strong:hover { opacity: .92; border-color: var(--ink); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn-sm { padding: 5px 10px; min-height: 32px; font-size: .82rem; }
.btn-lg { padding: 12px 20px; min-height: 48px; font-size: .98rem; }
.btn-block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 6px 11px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); font-size: .84rem; font-weight: 500; color: var(--ink-2); }
.chip small { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.chip[aria-pressed="true"] small { color: var(--accent); }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 5px; font-size: .72rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.gold { background: var(--flag-soft); color: var(--flag); border-color: transparent; }
.tag.navy { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag.dead { text-decoration: line-through; color: var(--muted); }
.bar { display: block; height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent-2); border-radius: 99px; }
.bar.ok > i { background: var(--ok); } .bar.mid > i { background: var(--flag); } .bar.bad > i { background: var(--bad); }
.field { display: grid; gap: 8px; min-width: 0; }
.field-label { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.input, .select { width: 100%; min-width: 0; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); }
.loading { display: grid; place-items: center; gap: 12px; padding: 60px 16px; color: var(--muted); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent-2); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-weight: 700; font-size: .8rem; min-width: 40px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.codebox { display: inline-flex; align-items: center; font-family: var(--f-mono); font-size: .74rem; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; letter-spacing: .02em; white-space: nowrap; }
.kbd { font-family: var(--f-mono); font-size: .7rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); background: var(--surface); }

/* Builder */
.intro { display: grid; gap: 6px; }
.intro p.lead { max-width: 74ch; color: var(--ink-2); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { padding: 14px 18px; display: grid; gap: 2px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi .k-l { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .k-v { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .k-s { font-size: .76rem; color: var(--muted); }
.kpi.bad .k-v { color: var(--bad); }
.builder { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
.steps { display: grid; gap: 16px; min-width: 0; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.step-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.step-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); font-family: var(--f-mono); font-size: .78rem; font-weight: 600; }
.step-h h2 { flex: 1; min-width: 0; }
.step-h .row { flex: none; }
.step-b { padding: 16px 18px; display: grid; gap: 16px; min-width: 0; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tree { display: grid; gap: 0; }
.tg { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.tg + .tg { margin-top: 10px; }
.trow { display: grid; grid-template-columns: 28px 22px minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; padding: 7px 10px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow.g { background: var(--surface-2); padding-block: 9px; }
.trow.g .tname { font-weight: 700; font-size: .95rem; }
.trow.t .tname { font-weight: 600; font-size: .9rem; }
.trow.t { padding-left: 18px; }
.trow.s { padding-left: 46px; font-size: .86rem; color: var(--ink-2); background: var(--surface); }
.tname[data-new]::after { content: attr(data-new); font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--flag); background: var(--flag-soft); padding: 1px 6px; border-radius: 4px; }
.tname { min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; cursor: pointer; }
.tcount { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tcount b { color: var(--ink); font-weight: 600; }
.twist { width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; color: var(--muted); }
.twist:hover { border-color: var(--line); background: var(--surface); }
.twist svg { width: 15px; height: 15px; transition: transform .15s; }
.twist[aria-expanded="true"] svg { transform: rotate(90deg); }
.twist.blank { visibility: hidden; }
.cb { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; margin: 0; }
.mode-cards { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.mode-card { display: grid; gap: 4px; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.mode-card b { font-size: .98rem; }
.mode-card span { font-size: .8rem; color: var(--muted); line-height: 1.45; }
.mode-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.mode-card[aria-pressed="true"] b { color: var(--accent); }
.n-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.n-input { width: 96px; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--f-mono); font-size: .84rem; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 16px; }
.slip { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.slip-h { padding: 14px 18px; border-bottom: 1px dashed var(--line-strong); display: grid; gap: 2px; }
.slip-big { font-family: var(--f-mono); font-size: 2rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.slip-big small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.slip dl { margin: 0; padding: 12px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; font-size: .84rem; }
.slip dt { color: var(--muted); }
.slip dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.slip-f { padding: 14px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.slip-warn { font-size: .8rem; color: var(--bad); }
.mbar { display: none; }
.hist { display: grid; gap: 0; }
.hist-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.hist-item:first-child { border-top: 0; padding-top: 0; }
.hist-t { font-weight: 600; font-size: .86rem; }
.hist-m { font-size: .74rem; color: var(--muted); }

/* Quiz */
.exam-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; }
.exam-bar .tt { display: grid; gap: 2px; min-width: 0; }
.exam-bar h2 { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exam-bar .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.exam-bar .prog { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 1rem; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.timer.warn { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.progress-line { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress-line > i { display: block; height: 100%; background: var(--accent-2); transition: width .25s; }
.exam { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.qhead .qno { font-weight: 800; font-size: .95rem; margin-right: 4px; }
.qhead .sub { font-size: .78rem; color: var(--muted); min-width: 0; }
.qhead .flag-btn { margin-left: auto; }
.qbody { padding: 20px 22px 18px; }
.qtext { font-family: var(--f-serif); font-size: 1.16rem; line-height: 1.55; font-weight: 500; max-width: 74ch; color: var(--ink); }
.qhint { font-size: .8rem; color: var(--muted); margin-top: 8px; font-weight: 600; }
.answers { display: grid; gap: 8px; margin-top: 16px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); line-height: 1.5; }
.opt:hover:not([disabled]) { border-color: var(--accent-2); background: var(--surface-2); }
.opt .key { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font-family: var(--f-mono); font-size: .74rem; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt[aria-pressed="true"] .key, .opt[aria-checked="true"] .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.is-correct .key { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.is-wrong .key { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; font-weight: 700; font-size: 1rem; padding: 14px; }
.st-row, .mt-row, .od-row { display: grid; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.st-row { grid-template-columns: minmax(0, 1fr) auto; }
.mt-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.mt-left { font-weight: 600; }
.od-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
.od-num { font-family: var(--f-mono); font-weight: 600; color: var(--accent); text-align: center; }
.is-correct.st-row, .is-correct.mt-row, .is-correct.od-row { border-color: var(--ok); background: var(--ok-soft); }
.is-wrong.st-row, .is-wrong.mt-row, .is-wrong.od-row { border-color: var(--bad); background: var(--bad-soft); }
.od-btns { display: flex; gap: 4px; }

.basis { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: .84rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }

.basis-docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.basis-docs li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; }
.basis-docs .bd-t { font-size: .84rem; color: var(--ink); min-width: 0; }

.fb-detail p { font-size: .92rem; max-width: 78ch; }

.eff { font-family: var(--f-mono); font-size: .72rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; }
.doc-chip { font-family: var(--f-mono); font-size: .72rem; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); }
.doc-chip:hover { border-color: var(--accent-2); color: var(--accent); }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.nav-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; max-height: 320px; overflow-y: auto; padding: 2px; }

/* Result */
.report { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.score-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.ring text { font-family: var(--f-mono); font-weight: 600; fill: var(--ink); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 5px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.mid { background: var(--flag-soft); color: var(--flag); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.score-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }

.btab { width: 100%; border-collapse: collapse; font-size: .84rem; }
.btab th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
.btab th.n, .btab td.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btab td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.btab td.b { width: 34%; padding-left: 12px; }
.btab tr:last-child td { border-bottom: 0; }
.review { display: grid; gap: 8px; }
.review-item { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.review-item > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; }
.review-item > summary::-webkit-details-marker { display: none; }
.review-item .rq { min-width: 0; }
.review-item .rmeta { display: block; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
.review-item .rbody { padding: 0 14px 14px 50px; display: grid; gap: 8px; font-size: .92rem; }
.mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.mark svg { width: 15px; height: 15px; }
.mark.ok { background: var(--ok-soft); color: var(--ok); }
.mark.bad { background: var(--bad-soft); color: var(--bad); }
.ans-ok { border-left: 3px solid var(--ok); padding-left: 10px; }
.ans-you { border-left: 3px solid var(--line-strong); padding-left: 10px; }
.ans-you.bad { border-left-color: var(--bad); }

/* Drawer & sources */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 41; background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -20px 0 40px -30px rgba(0, 0, 0, .5); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }

.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

.doc-group h3 { padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); margin-bottom: 8px; }
.doc-list { display: grid; gap: 8px; }
.doc-card { display: grid; gap: 5px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.doc-card.hl { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.doc-no { font-family: var(--f-mono); font-weight: 600; font-size: .86rem; color: var(--accent); }
.doc-kind { font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.doc-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .76rem; color: var(--muted); }
.doc-title { font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: .9rem; max-width: min(92vw, 520px); transition: opacity .2s, transform .2s; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.foot { padding-block: 20px 34px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); display: grid; gap: 6px; }
.foot strong { color: var(--ink-2); }

@media (max-width: 980px) {
  .builder, .report, .exam { grid-template-columns: 1fr; }
  .side { position: static; }
  .nav { position: static; }
  .side .slip { display: none; }
  .mbar { display: flex; position: sticky; bottom: 0; z-index: 15; margin-top: 16px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 -8px 30px -20px rgba(0, 0, 0, .45); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 12px; align-items: center; justify-content: space-between; }

@media (max-width: 420px) {

  .src-btn .dot { display: none; }
}

.mtab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 12px 14px 10px; font-weight: 700; font-size: .9rem; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }

/* Đọc số: kiểu Việt (1.200.000 · 37,2 · 1,2 triệu) hoặc kiểu Anh (1,200,000 · 37.2) */
function parseNumVi(raw, unit) {

  if (!s) return NaN;
  let mult = 1; const u = String(unit || "").toLowerCase();
  if (/đồng/.test(u) && !/triệu|tỷ|nghìn/.test(u)) {
    for (const [re, m] of [[/(tỷ|tỉ|ty)\s*(đồng|đ)?$/, 1e9], [/(triệu|trieu|tr)\s*(đồng|đ)?$/, 1e6], [/(nghìn|ngàn|nghin|ngan|k)\s*(đồng|đ)?$/, 1e3]]) if (re.test(s)) { mult = m; s = s.replace(re, "").trim(); break; }
  }
  s = s.replace(/[^\d.,]+$/u, "").replace(/^[^\d.,+\-]+/u, "").trim().replace(/\s/g, "").replace(/^\+/, "");
  const neg = s.startsWith("-"); if (neg) s = s.slice(1);

  if (dots && commas) t = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (commas) t = commas > 1 ? s.replace(/,/g, "") : s.replace(",", ".");
  else if (dots) t = dots > 1 ? s.replace(/\./g, "") : s.split(".")[1].length === 3 ? s.replace(".", "") : s;
  else t = s;
  const v = Number(t) * mult; return neg ? -v : v;
}

  let s = String(raw == null ? "" : raw).trim().toLowerCase().replace(/\s/g, "");

  s = s.replace(/[^\d.,\-]+$/u, "").replace(/^[^\d.,+\-]+/u, "").replace(/^\+/, "");
  const neg = s.startsWith("-"); if (neg) s = s.slice(1);

/* ---- Lưu đồ: SVG đã kết xuất trong gói nguồn, tải khi mở; phóng to / toàn màn hình ---- */
function flowView(p, nodeName, full) {
  const boxEl = h("div", { class: "flow-box", role: "region", tabindex: "0", "aria-label": "Lưu đồ " + p.id }, sopLoading("Đang tải lưu đồ…"));
  let svg = null, nat = 0, z = null;
  const zl = h("span", { class: "mono note" });
  const apply = () => { if (!svg) return; if (z == null) { svg.style.width = "100%"; svg.style.maxWidth = nat + "px"; zl.textContent = "Vừa"; } else { svg.style.width = Math.round(nat * z) + "px"; svg.style.maxWidth = "none"; zl.textContent = Math.round(z * 100) + "%"; } };
  const cur = () => (z == null ? (svg ? svg.getBoundingClientRect().width / nat : 1) : z);
  const setZ = (v) => { z = Math.min(3, Math.max(0.3, Math.round(v * 10) / 10)); apply(); };
  const tools = h("div", { class: "flow-tools" },
    h("button", { class: "btn btn-sm", type: "button", "aria-label": "Thu nhỏ", onclick: () => setZ(cur() - 0.2) }, "−"), zl,
    h("button", { class: "btn btn-sm", type: "button", "aria-label": "Phóng to", onclick: () => setZ(cur() + 0.2) }, "+"),
    h("button", { class: "btn btn-sm btn-ghost", type: "button", onclick: () => setZ(1) }, "100%"),
    h("button", { class: "btn btn-sm btn-ghost", type: "button", onclick: () => { z = null; apply(); } }, "Vừa khung"),
    full ? null : h("button", { class: "btn btn-sm", type: "button", onclick: () => flowFull(p, nodeName) }, icon("grid"), "Toàn màn hình"));
  sopSvg(p.id).then((txt) => {
    // SVG của gói nguồn được Mermaid tuần tự hóa kiểu HTML (nhãn có <br> không đóng) nên phân tích bằng bộ HTML; template không thực thi mã.
    const tpl = document.createElement("template"); tpl.innerHTML = txt; const el = tpl.content.querySelector("svg");
    if (!el) throw new Error("SVG không hợp lệ");
    svg = document.importNode(el, true);
    const vb = svg.viewBox && svg.viewBox.baseVal; nat = parseFloat(svg.getAttribute("width")) || (vb ? vb.width : 800);
    svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Lưu đồ " + p.id + " – " + p.title);
    boxEl.textContent = ""; boxEl.append(svg);
    const w = boxEl.clientWidth - 20; z = w > 0 && w / nat < 0.6 ? 0.8 : null; apply();
  }).catch((e) => { boxEl.textContent = ""; boxEl.append(h("div", { class: "empty", text: "Không tải được lưu đồ (" + e.message + "). Danh sách nhánh bên dưới vẫn đầy đủ." })); });
  if (full) return [tools, boxEl];
  const lg = (cls, t, st) => h("span", null, h("i", { style: st }), t);
  const legend = h("div", { class: "sop-legend" },
    lg("", "Bắt đầu", "background:#15214d;border-color:#15214d;border-radius:8px"), lg("", "Hoạt động", "background:#eef8fb;border-color:#1d6f88"),
    lg("", "Chốt kiểm tra (hình thoi)", "background:#fff3d2;border-color:#9c6a12;transform:rotate(45deg) scale(.8)"), lg("", "Xử lý ngoại lệ", "background:#fff0ef;border-color:#b74f4a"),
    lg("", "Rẽ nhánh", "background:#e7edff;border-color:#42559a"), lg("", "Hoàn tất", "background:#e9f6ee;border-color:#2d7850;border-radius:8px"), lg("", "Dừng", "background:#f5e9ec;border-color:#9b5062;border-radius:8px"));
  const kinds = {}; p.diagram.nodes.forEach((n) => (kinds[n.kind] = (kinds[n.kind] || 0) + 1));
  return [h("p", { class: "note", text: "Mỗi ô: mã bước · người làm, dòng dưới là việc cần làm. Hình thoi là chốt kiểm tra: đạt thì đi tiếp, không đạt thì sửa rồi kiểm lại." }),
    legend, tools, boxEl,
    h("p", { class: "note", text: `${p.diagram.nodes.length} nút (${Object.entries(kinds).map(([k, n]) => lbl("kind", k).toLowerCase() + " " + n).join(", ")}) · ${p.diagram.edges.length} nhánh. ${p.diagram.routing_authority || ""}` }),
    h("details", { class: "sop-x" }, h("summary", null, "Danh sách các đường đi · " + p.diagram.edges.length), h("div", null, h("div", { class: "sop-tbl" }, h("table", null,
      h("thead", null, h("tr", null, h("th", { text: "Từ" }), h("th", { text: "Đến" }), h("th", { text: "Nhãn" }), h("th", { text: "Điều kiện" }))),
      h("tbody", null, p.diagram.edges.map((e) => h("tr", null, h("td", { text: nodeName(e.source) }), h("td", { text: nodeName(e.target) }), h("td", { text: e.label || "—" }), h("td", null, lbl("cond", e.condition), " ", codebox(e.condition))))))))),
    h("details", { class: "sop-x" }, h("summary", null, "Bước theo từng phòng · " + p.diagram.lanes.length), h("div", null, p.diagram.lanes.map((l) => h("div", { class: "sop-ref" }, codebox(l.id), h("b", { text: l.name }), h("span", { class: "note", text: l.node_ids.map(nodeName).join(" · ") }))))),
    h("details", { class: "sop-x" }, h("summary", null, "Mã nguồn lưu đồ (cho người chỉnh sửa)"), h("div", null, h("pre", null, h("code", { text: p.diagram.mermaid }))))];
}
function flowFull(p, nodeName) {
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  const esc = (e) => { if (e.key === "Escape") close(); };
  const [tools, boxEl] = flowView(p, nodeName, true);
  const ov = h("div", { class: "flow-full", role: "dialog", "aria-modal": "true", "aria-label": "Lưu đồ " + p.id },
    h("div", { class: "flow-bar" }, h("b", null, codebox(p.id), " ", p.title), h("div", { class: "row" }, tools, h("button", { class: "btn btn-sm btn-strong", type: "button", onclick: close }, icon("x"), "Đóng"))), boxEl);
  document.body.append(ov); document.body.style.overflow = "hidden"; document.addEventListener("keydown", esc);
  const b = ov.querySelector(".btn-strong"); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* bỏ qua */ }
